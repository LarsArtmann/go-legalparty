name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  consumer-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Simulate consumer importing the module
        run: |
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          go mod init consumer-test
          printf 'package main\n\nimport (\n\t_ "github.com/larsartmann/go-legalparty"\n\t_ "github.com/larsartmann/go-error-family"\n)\n\nfunc main() {}\n' > main.go
          GOWORK=off go mod edit -replace "github.com/larsartmann/go-legalparty=$GITHUB_WORKSPACE"
          GOWORK=off go mod tidy
          GOWORK=off go build ./...
          GOWORK=off go list -m all

  docs-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned dprint
        run: curl -fsSL https://dprint.dev/install.sh | sh -s 0.64.3

      - name: Check markdown/json/yaml formatting
        run: ~/.dprint/bin/dprint check

  # Fleet workflow policy (same pin as go-error-family, adopted
  # 2026-11-02): external cue schemas vet the workflow files for the
  # policy classes actionlint has no concept of — action pin formats,
  # runner allowlist, permission shape. The policy checkout is pinned by
  # commit SHA: a policy change cannot silently redefine what this
  # repo's CI enforces (bumping the pin is a deliberate, reviewable act).
  policy-vet:
    name: Workflow Policy (cue vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install pinned cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Check out the fleet policy schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LarsArtmann/cue-policy
          ref: f0ed5f514b6c1d1b5552231ddb9d3351a3983359
          path: cue-policy
          persist-credentials: false

      - name: Vet workflows against the fleet policy
        run: cue vet -d '#CIWorkflow' ./cue-policy .github/workflows/ci.yml
